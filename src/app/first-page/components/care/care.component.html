@if (items().length) {
<section class="care section" id="cuidados">
  <div class="container">
    <div class="section-head section-head--wide">
      <h2 class="care__title" appReveal>Remoção de cílios</h2>
    </div>

    <div class="care__list">
      @for (item of items(); track item.slug; let i = $index) {
        <article class="row" [id]="item.slug" [class.row--flip]="i % 2 === 1">
          <div class="row__image" appReveal>
            @if (item.img) { <img [src]="item.img" [alt]="item.name" loading="lazy" /> }
          </div>
          <div class="row__text">
            <h3 appReveal="100">{{ item.name }}</h3>
            <p appReveal="150">{{ item.description }}</p>
            <div class="row__buy" appReveal="250">
              <span class="row__price">{{ price(item.price) }}</span>
              <a
                class="btn btn--gold"
                data-track="whatsapp_click"
                data-track-location="care"
                data-track-service-type="care"
                [attr.data-track-service-name]="item.name"
                [attr.data-track-price]="item.price"
                [href]="link(item)" target="_blank" rel="noopener">Agendar</a>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
}
