<section class="hero" id="inicio">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="container hero__grid">
    <div class="hero__copy">
      <span class="eyebrow" appReveal>Lash Designer</span>
      <h1 appReveal="100">Um olhar <em>marcante</em></h1>
      <p class="hero__lead" appReveal="200">
        Extensão de cílios personalizada, higiênica e feita com todo o cuidado para realçar a sua beleza natural.
      </p>

      <div class="hero__actions" appReveal="300">
        <a class="btn btn--gold" data-track="whatsapp_click" data-track-location="hero" data-track-service-name="geral" [href]="whatsapp" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.2-1.4A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.34-2 1.4-.5.06-1.14.09-1.84-.12-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.95-4.36-.14-.2-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.3.58-.37.78-.37h.56c.18 0 .42-.07.65.5l.9 2.2c.07.15.12.32.02.5-.1.2-.15.32-.3.5l-.45.52c-.15.15-.3.31-.13.6.17.3.77 1.27 1.65 2.05 1.13 1 2.1 1.32 2.4 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15l2.1 1c.3.14.5.2.57.33.07.12.07.7-.18 1.4z"/></svg>
          Agendar pelo WhatsApp
        </a>
        <a class="btn btn--ghost" data-track="nav_click" data-track-location="hero" data-track-target="valores" href="#valores" (click)="scroller.scrollTo('valores', $event)">Ver valores</a>
      </div>

      <dl class="hero__prices" appReveal="400">
        <div>
          <dt>Extensão de cílios</dt>
          <dd><small>aplicação</small> {{ lashPrice }}</dd>
        </div>
        <div>
          <dt>Manutenção</dt>
          <dd><small>por</small> {{ packagePrice }}</dd>
        </div>
      </dl>
    </div>

    <div class="hero__visual" appReveal="200">
      <div class="hero__frame">
        <img src="assets/hero-espaco.jpg" alt="Espaço LR Estética Avançada" width="960" height="1639" fetchpriority="high" />
      </div>
      
    </div>
  </div>

  <a class="hero__scroll" data-track="nav_click" data-track-location="hero_scroll_indicator" data-track-target="sobre-mim" href="#sobre-mim" (click)="scroller.scrollTo('sobre-mim', $event)" aria-label="Rolar para baixo">
    <span></span>
  </a>
</section>
