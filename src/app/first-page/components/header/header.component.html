<header class="header" [class.header--solid]="scrolled || menuOpen">
  <div class="container header__bar">
    <a class="brand" href="#inicio" (click)="go('inicio', $event)" aria-label="Lais Ribeiro, ir para o início">
      <span class="brand__name">Lais Ribeiro</span>
      <span class="brand__role">Lash Designer</span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen" aria-label="Principal">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              [class.is-active]="active === link.id"
              (click)="go(link.id, $event)"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
      <a class="btn btn--gold btn--sm nav__cta" [href]="whatsapp" target="_blank" rel="noopener">Agendar horário</a>
    </nav>

    <button
      class="burger"
      type="button"
      [class.burger--open]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-label="Abrir menu"
      (click)="toggleMenu()"
    >
      <span></span><span></span>
    </button>
  </div>
  <div class="progress" [style.transform]="'scaleX(' + progress + ')'"></div>
</header>
